name: work

channels:
  - conda-forge

dependencies:
  - python=3.12
  - jupyter
  - jupytext
  - matplotlib
  - matplotlib-fontja
  - numpy
  - pandas
  - pytest
  - pip
  # for kaggle
  # - kaggle
  # - lightgbm
  # - scikit-learn
  # - networkx

  # このファイルは docker/Dockerfile でイメージビルド時に読まれる (env create)。
  # そのため「ソースが無いと解決できない依存」をここに書いてはいけない。
  #
  # 具体的には自分自身の editable install (-e .[dev,test,optional]) が該当する。
  # setuptools_scm がバージョンを解決するのに .git を要求するが、.git は
  # イメージには入れず bind mount で渡しているため、ビルド時には存在しない。
  # よって editable install は .devcontainer/devcontainer.json の
  # postCreateCommand 側で uv 経由で行う。
