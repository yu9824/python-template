name: docker
run-name: ${{ github.workflow }} (${{ github.ref_name }})

# 注意: この workflow は paths フィルタを持つため、required status check には
# 設定しないこと。paths に該当しない PR ではこの workflow 自体がスキップされ、
# その場合 GitHub 上のチェックは "Pending" のまま残ってしまう。required に
# していると、該当しない変更の PR がいつまでもマージできなくなる。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - 'docker/**'
      # 開発用イメージはビルド時に environment.yml から conda 環境を作る
      - 'environment.yml'
      - '.github/workflows/docker.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.devcontainer/**'
      - 'docker/**'
      - 'environment.yml'
      - '.github/workflows/docker.yml'

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker compose config
        run: |
          docker compose -f .devcontainer/docker-compose.yml config -q
      - name: Build devcontainer image
        run: |
          docker compose -f .devcontainer/docker-compose.yml build app

  user-image:
    runs-on: ubuntu-latest
    steps:
      # setuptools_scm がタグからバージョンを決めるので、履歴とタグごと取る。
      # 浅いクローンでもビルドは通るが、バージョンが 0.1.devN になる。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build user image
        run: |
          docker build -f docker/Dockerfile -t python-template:ci .
      - name: Smoke test
        run: |
          docker run --rm python-template:ci python -m python_template --version
